<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무보고</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무보고">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box}
  /* 아래로 당겨서 새로고침(pull-to-refresh) 차단 — 실수로 당겨도 로그인 화면으로 안 튕김 */
  html,body{overscroll-behavior-y:contain}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#1f2937}
  header{background:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #e5e7eb;position:sticky;top:0}
  header select,header button{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;background:#fff;cursor:pointer}
  header .grow{flex:1}
  .boss-btn{cursor:pointer}
  .tabs{display:flex;gap:4px;padding:10px 12px;overflow-x:auto}
  .tabs button{white-space:nowrap;padding:8px 14px;border:0;border-radius:20px;background:#e5e7eb;font-size:14px;cursor:pointer}
  .tabs button.active{background:#2563eb;color:#fff}
  main{padding:0 12px 40px;max-width:640px;margin:0 auto}
  .item{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center}
  .item input[type=checkbox]{width:20px;height:20px;flex-shrink:0}
  .item .ti{flex:1;border:0;font-size:15px;outline:none}
  .item .memo{width:38%;border:0;border-left:1px solid #eee;padding-left:8px;font-size:13px;color:#6b7280;outline:none}
  .item.done .ti{text-decoration:line-through;color:#9ca3af}
  .item .del{border:0;background:none;color:#d1d5db;font-size:18px;cursor:pointer}
  .add{width:100%;padding:11px;border:1px dashed #cbd5e1;border-radius:10px;background:#fff;color:#2563eb;font-size:14px;cursor:pointer;margin-top:4px}
  textarea.free{width:100%;min-height:180px;border:1px solid #e5e7eb;border-radius:10px;padding:12px;font-size:15px;font-family:inherit;margin-top:8px}
  .hint{color:#9ca3af;font-size:13px;padding:4px 2px}
  #loginView{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:60px auto;padding:0 16px}
  #loginView select,#loginView input,#loginView button{padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
  #loginView button{background:#2563eb;color:#fff;border:0;cursor:pointer}
  .saved{color:#16a34a;font-size:12px;margin-left:8px}
  #reloadBtn{padding:6px 10px;font-size:16px;line-height:1;color:#374151}
  #reloadBtn.spin{animation:sp .6s linear}
  @keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .langBtn{padding:6px 11px!important;font-size:13px!important;background:#fff!important;color:#374151!important;border:1px solid #d1d5db!important;border-radius:8px;cursor:pointer;width:auto!important;align-self:flex-end}
  /* 직원 현황판 (읽기 전용) */
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin:8px 0}
  .card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card .cnt{margin-left:auto;font-size:12px;color:#6b7280;font-weight:400}
  .bar{height:5px;background:#eef0f3;border-radius:3px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;background:#22c55e}
  .ov{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:14px;line-height:1.45}
  .ov .mk{flex-shrink:0;color:#22c55e}
  .ov.undone .mk{color:#d1d5db}
  .ov.done .tx{color:#9ca3af;text-decoration:line-through}
  .ov .m{color:#9ca3af;font-size:12px}
  .empty{color:#9ca3af;font-size:13px}
  .freeview{white-space:pre-wrap;font-size:14px;line-height:1.5}
  .src{color:#b6bbc4;font-size:12px;line-height:1.4;margin-top:3px;white-space:pre-wrap}
  /* 월간 달력 */
  .calbar{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 0;font-size:15px;font-weight:600}
  .calbar button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:5px 12px;font-size:15px;cursor:pointer}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .dow{text-align:center;font-size:11px;color:#9ca3af;padding:2px 0}
  .cal .cell{min-height:64px;background:#fff;border:1px solid #e9ecef;border-radius:8px;padding:3px;display:flex;flex-direction:column;align-items:center;cursor:pointer;overflow:hidden}
  .cal .cell.blank{background:transparent;border:0;cursor:default}
  .cal .cell .dnum{font-size:12px;color:#374151;line-height:1.4}
  .cal .cell .badge{font-size:10px;color:#6b7280;line-height:1.3;margin-top:1px}
  .cal .cell{align-items:stretch;padding:3px 4px}
  .cal .cell .dnum{align-self:center}
  .cal .cell .ev{font-size:9.5px;line-height:1.25;margin-top:2px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px;padding:1px 3px;background:#eef2ff;color:#3730a3}
  /* 사람별 색 — 현황판에서 누구 일인지 한눈에 */
  .ev.c0{background:#dbeafe;color:#1e40af}
  .ev.c1{background:#dcfce7;color:#166534}
  .ev.c2{background:#fef3c7;color:#92400e}
  .ev.c3{background:#fce7f3;color:#9d174d}
  .ev.c4{background:#e0e7ff;color:#3730a3}
  .ev.c5{background:#ccfbf1;color:#115e59}
  .cal .cell .ev.note{border-left:3px solid currentColor;padding-left:3px}
  .legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px 2px 2px;font-size:11px}
  .legend span{border-radius:4px;padding:1px 6px}
  .cal .cell .ev.done{text-decoration:line-through;opacity:.55}
  .cal .cell .ev.note{background:#faf5ff;color:#7c3aed}
  .cal .cell .more{font-size:9px;color:#9ca3af;line-height:1.2}
  @media (max-width:420px){ .cal .cell .ev{font-size:9px} }
  .cal .cell.has{border-color:#bfdbfe;background:#f8fbff}
  .cal .cell.full{border-color:#86efac;background:#f2fdf5}
  .cal .cell.full .badge{color:#16a34a}
  .cal .cell.today .dnum{color:#2563eb;font-weight:700}
  .cal .cell.sel{outline:2px solid #2563eb;outline-offset:-2px}
  .cal .cell.sun .dnum{color:#dc2626}
  .dayhead{font-size:14px;font-weight:600;margin:14px 0 4px}
  .punch{display:flex;gap:10px;margin:10px 0}
  .punch button{flex:1;padding:22px 0;font-size:18px;font-weight:700;border:0;border-radius:12px;color:#fff;cursor:pointer}
  .punch .in{background:#2563eb}
  .punch .out{background:#6b7280}
  .punch button:disabled{opacity:.4}
  .attrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:9px 12px;margin:6px 0;font-size:14px}
  .attrow .nm{font-weight:600;min-width:64px}
  .attrow .tm{color:#374151}
  .attrow .rt{margin-left:auto;font-size:12px;color:#6b7280}
  .attrow.none{background:#fafafa;color:#9ca3af}
  .attrow .lt{color:#dc2626;font-size:12px}
  .attbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .attbar button,.attbar input{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;background:#fff}
  .attbar .go{background:#2563eb;color:#fff;border:0;cursor:pointer}
  .strow{display:flex;align-items:center;gap:6px;padding:6px 0;font-size:14px;border-bottom:1px solid #ede9fe}
  .strow .nm{flex:1}
  .strow.off .nm{color:#9ca3af;text-decoration:line-through}
  .strow button{padding:5px 9px;border:1px solid #d1d5db;background:#fff;border-radius:7px;font-size:12px;cursor:pointer}
  .sc{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:11px 13px;margin:8px 0}
  .sc h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
  .sc .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .sc .k{font-size:11px;color:#9ca3af}
  .sc .v{font-size:15px;font-weight:600;color:#1f2937;line-height:1.3}
  .sc .v small{font-size:11px;color:#9ca3af;font-weight:400}
  .sc .rate{margin-left:auto;font-size:12px;font-weight:600}
  .sc .bar{height:6px;background:#eef0f3;border-radius:3px;overflow:hidden;margin-top:9px}
  .sc .bar i{display:block;height:100%}
  .sc .warn{color:#dc2626}
  .cal .cell .badge.note{color:#7c3aed}
  .mention{background:#faf5ff;border:1px solid #e9d5ff;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px;line-height:1.45}
  .mention .from{display:block;font-size:11px;color:#9333ea;margin-bottom:2px}
  .ov.boss .tx{font-weight:600}
  .ov .tag{display:inline-block;font-size:10px;color:#b45309;background:#fef3c7;border-radius:4px;padding:0 4px;margin-right:4px;vertical-align:1px}
  .ov .ovdel{margin-left:auto;flex-shrink:0;border:0;background:none;color:#d1d5db;font-size:16px;line-height:1;cursor:pointer;padding:0 2px}
  .ov .ovdel.ask{color:#dc2626;font-size:11px}
  .asgBtn{margin-top:8px;width:100%;padding:8px;border:1px dashed #cbd5e1;border-radius:8px;background:#fff;color:#2563eb;font-size:13px;cursor:pointer}
  .asgBox{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .asgBox input{flex:1;min-width:150px;padding:9px;border:1px solid #d1d5db;border-radius:8px}
  .asgBox button{padding:9px 12px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
  .asgMsg{font-size:12px;margin-top:4px}
</style></head>
<body>
  <div id="loginView">
    <button class="langBtn" type="button">MN</button>
    <h2 style="text-align:center" data-i18n="appTitle">업무보고</h2>
    <select id="nameSel"><option value="" data-i18n="selectName">이름을 선택하세요</option></select>
    <input id="staffPw" type="password" data-i18n-ph="password" placeholder="비밀번호">
    <button id="staffLoginBtn" data-i18n="login">로그인</button>
    <div class="hint" style="text-align:center" data-i18n="or">— 또는 —</div>
    <input id="bossPw" type="password" data-i18n-ph="bossPassword" placeholder="사장님 비밀번호">
    <button id="bossLoginBtn" data-i18n="bossLogin">사장님 로그인</button>
    <div class="err" id="loginErr" style="color:#dc2626;text-align:center;font-size:13px"></div>
  </div>

  <div id="appView" style="display:none">
    <header>
      <strong id="whoami"></strong>
      <select id="bossStaffSel" style="display:none"></select>
      <span class="grow"></span>
      <span class="saved" id="savedMsg"></span>
      <button id="reloadBtn" type="button" title="새로고침">↻</button>
      <button class="langBtn" type="button">MN</button>
      <button id="staffBtn" data-i18n="staffMgr">직원</button>
      <button id="alarmBtn" data-i18n="alarm">알람</button>
      <button id="pwBtn" data-i18n="changePw">비번변경</button>
      <button id="logoutBtn" data-i18n="logout">로그아웃</button>
    </header>
    <div id="pwPanel" style="display:none;padding:10px 12px;background:#fffbe6;border-bottom:1px solid #f0e6c0;max-width:640px;margin:0 auto">
      <div id="pwFields"></div>
    </div>
    <div id="alarmPanel" style="display:none;padding:10px 12px;background:#eff6ff;border-bottom:1px solid #cfe0fb;max-width:640px;margin:0 auto">
      <div id="alarmFields"></div>
    </div>
    <div id="staffPanel" style="display:none;padding:10px 12px;background:#f5f3ff;border-bottom:1px solid #ddd6fe;max-width:640px;margin:0 auto">
      <div id="staffFields"></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-p="today" class="active" data-i18n="today">오늘</button>
      <button data-p="tomorrow" data-i18n="tomorrow">내일</button>
      <button data-p="week" data-i18n="week">주간</button>
      <button data-p="month" data-i18n="month">월간</button>
      <button data-p="year" data-i18n="year">연간</button>
      <button data-p="att" data-i18n="att">근태</button>
      <button data-p="score" data-i18n="score">종합</button>
    </div>
    <main id="content"></main>
  </div>
  <script src="i18n.js"></script>
<script src="app.js"></script>
</body></html>
