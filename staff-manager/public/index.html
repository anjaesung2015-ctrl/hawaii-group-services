<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무보고</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무보고">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box}
  /* 아래로 당겨서 새로고침(pull-to-refresh) 차단 — 실수로 당겨도 로그인 화면으로 안 튕김 */
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#1f2937}
  header{background:#fff;padding:12px 16px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #e5e7eb;position:sticky;top:0}
  header select,header button{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;background:#fff;cursor:pointer}
  header .grow{flex:1}
  .boss-btn{cursor:pointer}
  .tabs{display:flex;gap:4px;padding:10px 12px;overflow-x:auto}
  .tabs button{white-space:nowrap;padding:8px 14px;border:0;border-radius:20px;background:#e5e7eb;font-size:14px;cursor:pointer}
  .tabs button.active{background:#2563eb;color:#fff}
  main{padding:0 12px 40px;max-width:640px;margin:0 auto}
  .item{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center}
  .item input[type=checkbox]{width:20px;height:20px;flex-shrink:0}
  .item .ti{flex:1;border:0;font-size:15px;outline:none}
  .item .memo{width:38%;border:0;border-left:1px solid #eee;padding-left:8px;font-size:13px;color:#6b7280;outline:none}
  .item.done .ti{text-decoration:line-through;color:#9ca3af}
  .item .from,.ov .from{flex-shrink:0;font-size:10px;color:#6b7280;background:#f3f4f6;border-radius:4px;padding:1px 5px;margin-right:4px}
  .item.carry{border-left:3px solid #f59e0b}
  .item .del{border:0;background:none;color:#d1d5db;font-size:18px;cursor:pointer}
  .item.tpl{flex-wrap:wrap;align-items:flex-start}
  .item.tpl .tx{flex:1;font-size:14px;line-height:1.45;min-width:0}
  .item.tpl.done .tx{text-decoration:line-through;color:#9ca3af}
  .item.tpl .memo{width:100%;border-left:0;border-top:1px solid #f1f5f9;padding:6px 0 0 30px}
  .tag.tpl{display:inline-block;font-size:10px;color:#1d4ed8;background:#dbeafe;border-radius:4px;padding:0 5px;margin-right:5px;vertical-align:1px;text-decoration:none}
  .chkhead{font-size:13px;color:#374151;margin:8px 0 2px}
  .chkhead .bar{height:6px;background:#e5e7eb;border-radius:3px;margin-top:4px;overflow:hidden}
  .chkhead .bar i{display:block;height:100%;background:#2563eb}
  .strow{flex-wrap:wrap}
  .rep .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin:6px 0 10px}
  .rep label{display:flex;flex-direction:column;font-size:12px;color:#6b7280;gap:3px}
  .rep input[type=text],.rep input[inputmode],.rep textarea{padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;font-family:inherit;width:100%;box-sizing:border-box;color:#111}
  .rep textarea{min-height:58px;resize:vertical}
  .rep .full{grid-column:1/-1}
  .rep .sum{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:4px 0 8px}
  .rep .sum b{font-size:16px}
  .rep .chk{font-size:13px;color:#374151;background:#f8fafc;border-radius:8px;padding:8px 10px;margin:6px 0}
  .rep .chk .low{color:#dc2626}
  .rep .kv{font-size:14px;margin:6px 0;white-space:pre-wrap}
  .rep .kv span{display:block;font-size:12px;color:#6b7280}
  .rep .save{width:100%;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer;margin-top:6px}
  .rep .ok{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
  .rep .ok input{width:20px;height:20px}
  .rep .badge{font-size:11px;padding:1px 7px;border-radius:10px;background:#fee2e2;color:#b91c1c;margin-left:auto;font-weight:400}
  .rep .badge.on{background:#dcfce7;color:#15803d}
  .rep .sum .neg{color:#dc2626}
  .mtask{background:#fff7ed;border-radius:8px;padding:8px 10px;margin:4px 0 8px;font-size:13px;line-height:1.5}
  .mtask .m{color:#9a3412}
  .ktasks{margin:6px 0 10px;font-size:13px}
  .ktask{display:grid;grid-template-columns:18px 1fr 70px 60px;gap:4px;align-items:center;margin:4px 0}
  .ktask input{padding:6px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;min-width:0}
  .ktask input[data-tf=progress]{grid-column:2/4}
  .ktask label{font-size:13px;display:flex;align-items:center;gap:2px}
  .exBtn{font-size:10px;padding:1px 6px;margin-left:4px;border:1px solid #c7d2fe;background:#eef2ff;color:#4338ca;border-radius:10px;cursor:pointer;vertical-align:1px}
  .exbox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;margin:-2px 0 8px;font-size:13px}
  .exbox .exhead{display:flex;gap:6px;align-items:center;color:#475569;margin-bottom:4px}
  .exbox .exClose{margin-left:auto;border:0;background:none;font-size:18px;color:#94a3b8;cursor:pointer}
  .exbox pre{white-space:pre-wrap;font-family:inherit;margin:0;line-height:1.5}
  .tpick select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;margin:8px 0;background:#fff}
  .jtable h3 .m,.tsec h4 .m{color:#9ca3af;font-weight:400;font-size:12px}
  .tsec{margin-top:10px}
  .tsec h4{margin:0 0 4px;font-size:14px;color:#1d4ed8;border-bottom:1px solid #e5e7eb;padding-bottom:3px}
  .trow{display:flex;gap:6px;align-items:flex-start;padding:5px 0;font-size:13px;line-height:1.5;border-bottom:1px dashed #f1f5f9}
  .trow .tag{flex:0 0 auto}
  .trow .m{color:#6b7280}
  .pblock{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
  .cam{display:inline-block;padding:7px 12px;border-radius:8px;background:#2563eb;color:#fff;font-size:13px;cursor:pointer}
  .pbad{font-size:12px;padding:2px 7px;border-radius:10px;background:#f3f4f6;color:#374151}
  .pbad.ok{background:#dcfce7;color:#15803d}
  .pbad.late{background:#fee2e2;color:#b91c1c}
  .pbad.warn{background:#fef3c7;color:#92400e}
  .pmsg{font-size:12px}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .thumbs:empty{display:none}
  .thumb{position:relative;display:block;width:72px;height:72px;border-radius:8px;overflow:hidden;background:#e5e7eb}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);color:#fff;font-size:10px;text-align:center}
  .item.pic{flex-wrap:wrap}
  .chk .pics{margin-top:8px;border-top:1px dashed #e5e7eb;padding-top:6px}
  .chk .ppl{margin-top:6px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .chk .ppl .m{color:#6b7280}
  .hrtabs{display:flex;gap:4px;overflow-x:auto;margin:8px 0}
  .hrtabs button{flex:0 0 auto;padding:7px 12px;border:1px solid #d1d5db;background:#fff;border-radius:18px;font-size:13px;cursor:pointer}
  .hrtabs button.on{background:#111827;color:#fff;border-color:#111827}
  .shwrap{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid #e5e7eb}
  table.shift{border-collapse:collapse;font-size:12px;min-width:560px;width:100%}
  table.shift th,table.shift td{border-bottom:1px solid #f1f5f9;padding:6px 4px;text-align:center;vertical-align:top}
  table.shift th.nm{text-align:left;white-space:nowrap;position:sticky;left:0;background:#fff}
  table.shift .today{background:#eff6ff}
  table.shift td.ed{cursor:pointer}
  table.shift td.sel{outline:2px solid #2563eb}
  table.shift .m,.hline .m,.memrow .m,.payrow .m,.org .m{color:#6b7280;font-size:11px}
  table.shift .bad,.hint.bad{color:#dc2626;font-size:11px}
  table.shift .good{color:#16a34a;font-size:11px}
  table.shift .lv{color:#7c3aed}
  .shed .row,.card .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:6px 0}
  .card label{font-size:12px;color:#6b7280;display:flex;flex-direction:column;gap:2px}
  .card input,.card select,.card textarea{padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit;box-sizing:border-box}
  .card > input,.card > textarea{width:100%;margin:4px 0}
  .card textarea{min-height:60px}
  .card h4{margin:12px 0 4px;font-size:13px}
  .hline{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed #e5e7eb;font-size:13px;flex-wrap:wrap}
  .hline .pre{white-space:pre-wrap;font-size:12px;margin-top:3px}
  .hline .acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .hline .acts .cmt{width:130px;padding:6px;font-size:12px}
  .hline button,.mini{padding:6px 10px;border:1px solid #d1d5db;background:#fff;border-radius:8px;font-size:12px;cursor:pointer}
  .hline button.ok{background:#16a34a;color:#fff;border-color:#16a34a}
  .hline button.no{background:#fff;color:#dc2626;border-color:#fca5a5}
  .hst{font-size:11px;padding:1px 7px;border-radius:10px;background:#fef3c7;color:#92400e;white-space:nowrap}
  .hst.approved{background:#dcfce7;color:#15803d}
  .hst.rejected{background:#fee2e2;color:#b91c1c}
  .hst.cancelled{background:#f3f4f6;color:#6b7280}
  .hst.boss{background:#e0e7ff;color:#3730a3}
  table.htab{width:100%;font-size:13px;border-collapse:collapse}
  table.htab td{padding:5px 4px;border-bottom:1px solid #f1f5f9}
  table.htab td:last-child{text-align:right}
  table.htab tr.b td{font-weight:600}
  table.htab tr.net td{font-weight:700;color:#1d4ed8;font-size:15px}
  .org .lvl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}
  .org .role{font-size:11px;color:#fff;background:#6b7280;border-radius:6px;padding:1px 6px;min-width:56px;text-align:center}
  .org .pill{background:#eef2ff;color:#3730a3;border-radius:12px;padding:2px 9px;font-size:13px}
  .org .sites{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
  .org .site{border:1px solid #e5e7eb;border-radius:10px;padding:8px}
  .org .site h4{margin:0 0 4px}
  .org .mem{font-size:13px;padding:2px 0}
  .memrow{border-bottom:1px solid #f1f5f9;padding:6px 0}
  .memrow.off{opacity:.6}
  .memrow summary{cursor:pointer;font-size:14px}
  .memrow .grid,.payrow .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
  .memrow .full,.payrow .full{grid-column:1/-1}
  .payrow .sum{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin:6px 0}
  .trow .tdel{margin-left:auto;border:0;background:none;color:#9ca3af;font-size:18px;cursor:pointer;padding:0 4px}
  .tag.new{background:#dcfce7;color:#15803d}
  .tedit{margin-top:14px;border-top:1px solid #e5e7eb;padding-top:10px}
  .tedit .row{display:flex;gap:6px;margin:6px 0}
  .tedit input,.tedit select{padding:8px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box}
  .tedit > input{width:100%;margin:4px 0}
  .trem{margin-top:10px;font-size:13px}
  details.rules{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13px}
  details.rules summary{cursor:pointer;font-weight:600}
  details.rules ol{margin:6px 0 0;padding-left:20px;line-height:1.55}
  .strow .asg{font-size:12px;color:#7c3aed;margin-right:4px}
  .strow .jobSel{font-size:12px;padding:4px;border:1px solid #d1d5db;border-radius:7px;max-width:160px}
  .add{width:100%;padding:11px;border:1px dashed #cbd5e1;border-radius:10px;background:#fff;color:#2563eb;font-size:14px;cursor:pointer;margin-top:4px}
  textarea.free{width:100%;min-height:180px;border:1px solid #e5e7eb;border-radius:10px;padding:12px;font-size:15px;font-family:inherit;margin-top:8px}
  .hint{color:#9ca3af;font-size:13px;padding:4px 2px}
  #loginView{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:60px auto;padding:0 16px}
  #loginView select,#loginView input,#loginView button{padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:15px}
  #loginView button{background:#2563eb;color:#fff;border:0;cursor:pointer}
  #loginView button:disabled{background:#93b4f5;cursor:default}   /* 확인 중 — 눌러도 소용없음을 눈으로 알림 */
  .saved{color:#16a34a;font-size:12px;margin-left:8px}
  #reloadBtn{padding:6px 10px;font-size:16px;line-height:1;color:#374151}
  #reloadBtn.spin{animation:sp .6s linear}
  #ptr{position:fixed;top:6px;left:50%;transform:translate(-50%,0);opacity:0;z-index:9999;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:18px;color:#6b7280;pointer-events:none;transition:opacity .15s}
  #ptr.ready{color:#2563eb}
  #ptr.spin{opacity:1!important;color:#2563eb;animation:ptrsp .6s linear infinite}
  @keyframes ptrsp{from{transform:translate(-50%,40px) rotate(0)}to{transform:translate(-50%,40px) rotate(360deg)}}
  @keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .langBtn{padding:6px 11px!important;font-size:13px!important;background:#fff!important;color:#374151!important;border:1px solid #d1d5db!important;border-radius:8px;cursor:pointer;width:auto!important;align-self:flex-end}
  /* 직원 현황판 (읽기 전용) */
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin:8px 0}
  .card h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card .cnt{margin-left:auto;font-size:12px;color:#6b7280;font-weight:400}
  .bar{height:5px;background:#eef0f3;border-radius:3px;overflow:hidden;margin-bottom:8px}
  .bar i{display:block;height:100%;background:#22c55e}
  .ov{display:flex;gap:8px;align-items:flex-start;padding:3px 0;font-size:14px;line-height:1.45}
  .ov .mk{flex-shrink:0;color:#22c55e}
  .ov.undone .mk{color:#d1d5db}
  .ov.done .tx{color:#9ca3af;text-decoration:line-through}
  .ov .m{color:#9ca3af;font-size:12px}
  .empty{color:#9ca3af;font-size:13px}
  .freeview{white-space:pre-wrap;font-size:14px;line-height:1.5}
  .src{color:#b6bbc4;font-size:12px;line-height:1.4;margin-top:3px;white-space:pre-wrap}
  /* 월간 달력 */
  .calbar{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 0;font-size:15px;font-weight:600}
  .daybar{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 2px;font-size:15px;font-weight:600}
  .daybar button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:4px 11px;font-size:15px;cursor:pointer}
  .daybar .back{font-size:12px;font-weight:500;padding:4px 9px;background:#2563eb;color:#fff;border:0}
  .daybar.past span{color:#7c3aed}
  .calbar button{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:5px 12px;font-size:15px;cursor:pointer}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .dow{text-align:center;font-size:11px;color:#9ca3af;padding:2px 0}
  .cal .cell{min-height:64px;background:#fff;border:1px solid #e9ecef;border-radius:8px;padding:3px;display:flex;flex-direction:column;align-items:center;cursor:pointer;overflow:hidden}
  .cal .cell.blank{background:transparent;border:0;cursor:default}
  .cal .cell .dnum{font-size:12px;color:#374151;line-height:1.4}
  .cal .cell .badge{font-size:10px;color:#6b7280;line-height:1.3;margin-top:1px}
  .cal .cell{align-items:stretch;padding:3px 4px}
  .cal .cell .dnum{align-self:center}
  .cal .cell .ev{font-size:9.5px;line-height:1.25;margin-top:2px;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:3px;padding:1px 3px;background:#eef2ff;color:#3730a3}
  /* 사람별 색 — 현황판에서 누구 일인지 한눈에 */
  .ev.c0{background:#dbeafe;color:#1e40af}
  .ev.c1{background:#dcfce7;color:#166534}
  .ev.c2{background:#fef3c7;color:#92400e}
  .ev.c3{background:#fce7f3;color:#9d174d}
  .ev.c4{background:#e0e7ff;color:#3730a3}
  .ev.c5{background:#ccfbf1;color:#115e59}
  .cal .cell .ev.note{border-left:3px solid currentColor;padding-left:3px}
  .legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px 2px 2px;font-size:11px}
  .legend span{border-radius:4px;padding:1px 6px}
  .cal .cell .ev.done{text-decoration:line-through;opacity:.55}
  .cal .cell .ev.note{background:#faf5ff;color:#7c3aed}
  .cal .cell .more{font-size:9px;color:#9ca3af;line-height:1.2}
  @media (max-width:420px){ .cal .cell .ev{font-size:9px} }
  .cal .cell.has{border-color:#bfdbfe;background:#f8fbff}
  .cal .cell.full{border-color:#86efac;background:#f2fdf5}
  .cal .cell.full .badge{color:#16a34a}
  .cal .cell.today .dnum{color:#2563eb;font-weight:700}
  .cal .cell.sel{outline:2px solid #2563eb;outline-offset:-2px}
  .cal .cell.sun .dnum{color:#dc2626}
  .dayhead{font-size:14px;font-weight:600;margin:14px 0 4px}
  .punch{display:flex;gap:10px;margin:10px 0}
  .punch button{flex:1;padding:22px 0;font-size:18px;font-weight:700;border:0;border-radius:12px;color:#fff;cursor:pointer}
  .punch .in{background:#2563eb}
  .punch .out{background:#6b7280}
  .punch button:disabled{opacity:.4}
  .attrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:9px 12px;margin:6px 0;font-size:14px}
  .attrow .nm{font-weight:600;min-width:64px}
  .attrow .tm{color:#374151}
  .attrow .rt{margin-left:auto;font-size:12px;color:#6b7280}
  .attrow.none{background:#fafafa;color:#9ca3af}
  .attrow .lt{color:#dc2626;font-size:12px}
  .attbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .attbar button,.attbar input{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;background:#fff}
  .attbar .go{background:#2563eb;color:#fff;border:0;cursor:pointer}
  .strow{display:flex;align-items:center;gap:6px;padding:6px 0;font-size:14px;border-bottom:1px solid #ede9fe}
  .strow .nm{flex:1}
  .strow.off .nm{color:#9ca3af;text-decoration:line-through}
  .strow button{padding:5px 9px;border:1px solid #d1d5db;background:#fff;border-radius:7px;font-size:12px;cursor:pointer}
  .sc{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:11px 13px;margin:8px 0}
  .sc h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
  .sc .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .sc .k{font-size:11px;color:#9ca3af}
  .sc .v{font-size:15px;font-weight:600;color:#1f2937;line-height:1.3}
  .sc .v small{font-size:11px;color:#9ca3af;font-weight:400}
  .sc .rate{margin-left:auto;font-size:12px;font-weight:600}
  .sc .bar{height:6px;background:#eef0f3;border-radius:3px;overflow:hidden;margin-top:9px}
  .sc .bar i{display:block;height:100%}
  .sc .warn{color:#dc2626}
  .cal .cell .badge.note{color:#7c3aed}
  .mention{background:#faf5ff;border:1px solid #e9d5ff;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px;line-height:1.45}
  .mention .from{display:block;font-size:11px;color:#9333ea;margin-bottom:2px}
