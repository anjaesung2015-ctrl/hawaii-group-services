<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하와이 테니스 클럽 · Hawaii Tennis Club</title>
<meta name="theme-color" content="#0f5132">
<!-- 경로는 모두 상대 경로 — 루트(/)에서도, /club/ 처럼 하위 경로에 올려도 그대로 동작한다 -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hawaii Tennis">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 로그인 -->
<section id="loginView" class="login" hidden>
  <div class="login-card">
    <div class="brand">
      <svg class="ball" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="#d8f05a"/>
        <path d="M6 10c9 6 11 22 4 30M42 10c-9 6-11 22-4 30" fill="none" stroke="#fff" stroke-width="2.5"/>
      </svg>
      <h1 id="brandName">Hawaii Tennis Club</h1>
      <p class="brand-sub" data-i18n="memberOnly">Гишүүдэд зориулсан</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <label class="field">
        <span data-i18n="phone">Утасны дугаар</span>
        <input id="loginPhone" type="tel" inputmode="numeric" autocomplete="username"
               placeholder="99112233" maxlength="15" required>
      </label>
      <label class="field">
        <span data-i18n="pin">ПИН (4 орон)</span>
        <input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password"
               placeholder="••••" maxlength="4" pattern="\d{4}" required>
      </label>
      <button class="btn btn-primary btn-lg" id="loginBtn" type="submit" data-i18n="login">Нэвтрэх</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>

    <!-- 아직 회원이 아닌 사람 — 신청하면 관리자가 승인한다 -->
    <button class="btn btn-ghost" id="joinBtn" type="button" style="width:100%;margin-top:2px" data-i18n="joinRequest">Гишүүнээр бүртгүүлэх</button>

    <!-- 홈 화면에 앱 설치 — 이미 앱으로 열려 있으면 숨긴다 -->
    <button class="btn btn-ghost" data-install type="button" style="width:100%;margin-top:2px" data-i18n="installApp">Install app</button>

  </div>
</section>

<!-- 앱 -->
<div id="appView" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="icon-btn" type="button" id="backBtn" aria-label="back" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <svg class="ball sm" viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="#d8f05a"/>
        <path d="M6 10c9 6 11 22 4 30M42 10c-9 6-11 22-4 30" fill="none" stroke="#fff" stroke-width="2.5"/>
      </svg>
      <div class="topbar-text">
        <strong id="topClub">Hawaii Tennis Club</strong>
      </div>
      <button class="icon-btn" type="button" id="refreshBtn" aria-label="refresh">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" type="button" id="menuBtn" aria-label="menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="sheet" id="menuSheet" hidden>
    <div class="sheet-body">
      <button class="sheet-item" id="rulesBtn" data-i18n="rulesTitle">Клубын дүрэм</button>
      <button class="sheet-item" data-install data-i18n="installApp">Install app</button>
      <button class="sheet-item" id="pushBtn" data-i18n="pushTitle">Утасны мэдэгдэл</button>
      <button class="sheet-item" id="levelBtn" data-i18n="myLevel">My level</button>
      <button class="sheet-item" id="pinBtn" data-i18n="changePin">ПИН солих</button>
      <button class="sheet-item owner-only" id="settingsBtn" data-i18n="settings">Тохиргоо</button>
      <button class="sheet-item danger" id="logoutBtn" data-i18n="logout">Гарах</button>
      <button class="sheet-item muted" id="menuClose" data-i18n="cancel">Болих</button>
    </div>
  </div>

  <main id="content"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span data-i18n="tabHome">Үндсэн</span>
    </button>
    <button data-tab="schedule">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>
      <span data-i18n="tabSchedule">Хуваарь</span>
    </button>
    <button data-tab="board">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span data-i18n="tabBoard">Чат</span>
    </button>
    <button data-tab="dues">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span data-i18n="tabDues">Хураамж</span>
    </button>
    <button data-tab="notices">
      <svg viewBox="0 0 24 24"><path d="M5 9v6h3l6 4V5L8 9H5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M18 9.5a4 4 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span data-i18n="tabNotices">Мэдэгдэл</span>
    </button>
    <button data-tab="members">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 11.2A3 3 0 0 0 16 5.2M18 20c0-2.3-.9-4-2.3-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span data-i18n="tabMembers">Гишүүд</span>
    </button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
